<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mission Control - $1M/Year Goal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }
        
        header p {
            font-size: 1.2rem;
            opacity: 0.9;
        }
        
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        
        .tab-btn {
            background: rgba(255, 255, 255, 0.2);
            border: none;
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }
        
        .tab-btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
        
        .tab-btn.active {
            background: white;
            color: #667eea;
        }
        
        .columns {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .column {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
        }
        
        .column h2 {
            color: #667eea;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .item {
            background: white;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.08);
            transition: transform 0.2s ease;
        }
        
        .item:hover {
            transform: translateY(-3px);
        }
        
        .item h3 {
            color: #333;
            margin-bottom: 10px;
            font-size: 1.1rem;
        }
        
        .item p {
            color: #666;
            font-size: 0.9rem;
            margin-bottom: 15px;
            line-height: 1.4;
        }
        
        .item-actions {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .btn {
            border: none;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
            font-size: 0.9rem;
        }
        
        .btn-approve {
            background: #4caf50;
            color: white;
        }
        
        .btn-start {
            background: #2196f3;
            color: white;
        }
        
        .btn-ship {
            background: #ff9800;
            color: white;
        }
        
        .btn-delete {
            background: #f44336;
            color: white;
        }
        
        .btn-secondary {
            background: #9e9e9e;
            color: white;
        }
        
        .btn:hover {
            opacity: 0.9;
            transform: scale(1.05);
        }
        
        .stats {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }
        
        .stat {
            text-align: center;
        }
        
        .stat-value {
            font-size: 2rem;
            font-weight: bold;
            color: #667eea;
        }
        
        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .footer {
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-size: 0.9rem;
            margin-top: 30px;
        }
        
        .empty-state {
            text-align: center;
            color: #999;
            font-style: italic;
            padding: 40px 20px;
        }
        
        .toolbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(0,0,0,0.2);
            padding: 10px 20px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        
        .toolbar button {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
        }
        
        .toolbar button:hover {
            background: rgba(255,255,255,0.3);
        }
        
        @media (max-width: 768px) {
            .columns {
                grid-template-columns: 1fr;
            }
            
            header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="toolbar">
            <div>
                <button onclick="exportData()">Export Data</button>
                <input type="file" id="fileInput" style="display: none;" accept=".json" onchange="importData(event)">
                <label for="fileInput" style="cursor:pointer;">Import Data</label>
            </div>
            <div>
                <small>Data stored in browser localStorage</small>
            </div>
        </div>
        
        <header>
            <h1>🚀 Mission Control</h1>
            <p>$1M/Year Goal Tracking System</p>
        </header>
        
        <div class="stats" id="stats">
            <div class="stat">
                <div class="stat-value" id="ideas-count">0</div>
                <div class="stat-label">Ideas</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="approved-count">0</div>
                <div class="stat-label">Approved</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="inprogress-count">0</div>
                <div class="stat-label">In Progress</div>
            </div>
            <div class="stat">
                <div class="stat-value" id="shipped-count">0</div>
                <div class="stat-label">Shipped</div>
            </div>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" data-tab="ideas">Ideas</button>
            <button class="tab-btn" data-tab="approved">Approved</button>
            <button class="tab-btn" data-tab="inProgress">In Progress</button>
            <button class="tab-btn" data-tab="shipped">Shipped</button>
        </div>
        
        <div class="columns">
            <div class="column" id="ideas-column">
                <h2>💡 Ideas</h2>
                <div class="items-container" id="ideas-items">
                    <!-- Ideas will be populated here -->
                </div>
            </div>
            
            <div class="column" id="approved-column">
                <h2>✅ Approved</h2>
                <div class="items-container" id="approved-items">
                    <!-- Approved items will be populated here -->
                </div>
            </div>
            
            <div class="column" id="inProgress-column">
                <h2>⚡ In Progress</h2>
                <div class="items-container" id="inProgress-items">
                    <!-- In progress items will be populated here -->
                </div>
            </div>
            
            <div class="column" id="shipped-column">
                <h2>🎉 Shipped</h2>
                <div class="items-container" id="shipped-items">
                    <!-- Shipped items will be populated here -->
                </div>
            </div>
        </div>
    </div>
    
    <script>
        const STORAGE_KEY = 'missionControlData';
        
        // Initialize data structure
        let data = {
            ideas: [],
            approved: [],
            inProgress: [],
            shipped: []
        };
        
        // Load from localStorage
        function loadData() {
            const saved = localStorage.getItem(STORAGE_KEY);
            if (saved) {
                try {
                    data = JSON.parse(saved);
                } catch (e) {
                    console.error('Failed to parse mission control data', e);
                }
            }
            // Seed with initial ideas if empty
            if (data.ideas.length === 0) {
                data.ideas = [
                    {
                        id: generateId(),
                        title: 'Micro-SaaS Boilerplate',
                        description: 'Starter kit for niche subscription apps with billing, auth, dashboard',
                        status: 'idea',
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: generateId(),
                        title: 'API-First Automation Glue',
                        description: 'Service connecting webhooks to custom actions with visual builder',
                        status: 'idea',
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: generateId(),
                        title: 'Niche Content-to-Cash',
                        description: 'Auto-generated reports/newsletters for specific professions/hobbies',
                        status: 'idea',
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: generateId(),
                        title: 'AI-Assisted Freelance Arbitrage',
                        description: 'Quick delivery of systematized services using LLMs',
                        status: 'idea',
                        createdAt: new Date().toISOString()
                    },
                    {
                        id: generateId(),
                        title: 'Digital Asset Flipper',
                        description: 'Build/acquire simple tools, improve, sell on marketplaces',
                        status: 'idea',
                        createdAt: new Date().toISOString()
                    }
                ];
                saveData();
            }
        }
        
        // Save to localStorage
        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }
        
        // Generate simple ID
        function generateId() {
            return Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
        }
        
        // Render functions
        function renderStats() {
            document.getElementById('ideas-count').textContent = data.ideas.length;
            document.getElementById('approved-count').textContent = data.approved.length;
            document.getElementById('inprogress-count').textContent = data.inProgress.length;
            document.getElementById('shipped-count').textContent = data.shipped.length;
        }
        
        function renderColumn(columnId, items, type) {
            const container = document.getElementById(`${columnId}-items`);
            
            if (items.length === 0) {
                container.innerHTML = '<div class="empty-state">No items in this column</div>';
                return;
            }
            
            container.innerHTML = items.map(item => `
                <div class="item" data-id="${item.id}">
                    <h3>${item.title}</h3>
                    <p>${item.description}</p>
                    <div class="item-actions">
                        ${type === 'idea' ? `
                            <button class="btn btn-approve" onclick="approveItem('${item.id}')">Approve</button>
                        ` : ''}
                        ${type === 'approved' ? `
                            <button class="btn btn-start" onclick="startItem('${item.id}')">Start Work</button>
                        : ''}
                        ${type === 'inProgress' ? `
                            <button class="btn btn-ship" onclick="shipItem('${item.id}')">Ship!</button>
                        ` : ''}
                        ${type !== 'shipped' ? `
                            <button class="btn btn-delete" onclick="deleteItem('${item.id}', '${type}')">Delete</button>
                        ` : ''}
                    </div>
                </div>
            `).join('');
        }
        
        function renderAll() {
            renderStats();
            renderColumn('ideas', data.ideas, 'idea');
            renderColumn('approved', data.approved, 'approved');
            renderColumn('inProgress', data.inProgress, 'inProgress');
            renderColumn('shipped', data.shipped, 'shipped');
        }
        
        // Action functions
        function approveItem(id) {
            const ideaIndex = data.ideas.findIndex(i => i.id === id);
            if (ideaIndex === -1) return;
            
            const idea = data.ideas[ideaIndex];
            idea.status = 'approved';
            idea.approvedAt = new Date().toISOString();
            
            data.approved.push(idea);
            data.ideas.splice(ideaIndex, 1);
            
            saveData();
            renderAll();
        }
        
        function startItem(id) {
            const approvedIndex = data.approved.findIndex(i => i.id === id);
            if (approvedIndex === -1) return;
            
            const approvedItem = data.approved[approvedIndex];
            approvedItem.status = 'inProgress';
            approvedItem.startedAt = new Date().toISOString();
            
            data.inProgress.push(approvedItem);
            data.approved.splice(approvedIndex, 1);
            
            saveData();
            renderAll();
        }
        
        function shipItem(id) {
            const inProgressIndex = data.inProgress.findIndex(i => i.id === id);
            if (inProgressIndex === -1) return;
            
            const inProgressItem = data.inProgress[inProgressIndex];
            inProgressItem.status = 'shipped';
            inProgressItem.shippedAt = new Date().toISOString();
            
            data.shipped.push(inProgressItem);
            data.inProgress.splice(inProgressIndex, 1);
            
            saveData();
            renderAll();
        }
        
        function deleteItem(id, type) {
            if (!confirm('Are you sure you want to delete this item?')) return;
            
            let array;
            switch(type) {
                case 'idea': array = data.ideas; break;
                case 'approved': array = data.approved; break;
                case 'inProgress': array = data.inProgress; break;
                case 'shipped': array = data.shipped; break;
                default: return;
            }
            
            const index = array.findIndex(i => i.id === id);
            if (index !== -1) {
                array.splice(index, 1);
                saveData();
                renderAll();
            }
        }
        
        // Export/Import
        function exportData() {
            const dataStr = JSON.stringify(data, null, 2);
            const blob = new Blob([dataStr], {type: 'application/json'});
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'mission-control-data.json';
            a.click();
            URL.revokeObjectURL(url);
        }
        
        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    // Validate basic structure
                    if (imported.ideas && imported.approved && imported.inProgress && imported.shipped) {
                        data = imported;
                        saveData();
                        renderAll();
                        alert('Data imported successfully!');
                    } else {
                        throw new Error('Invalid data format');
                    }
                } catch (err) {
                    alert('Failed to import data: ' + err.message);
                }
            };
            reader.onerror = function() {
                alert('Failed to read file');
            };
            reader.readAsText(file);
            
            // Reset input
            event.target.value = '';
        }
        
        // Tab switching
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                
                const tabId = btn.getAttribute('data-tab');
                document.querySelectorAll('.column').forEach(col => {
                    col.style.display = col.id === tabId + '-column' ? 'block' : 'none';
                });
            });
        });
        
        // Initialize
        loadData();
        renderAll();
    </script>
</body>
</html>
